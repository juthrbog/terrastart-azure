# Documents the default config for all environments and shows possible values.
# Note that this is just the minimum required set of configs for a deployment.
# Update this file with any new config values you add to the live <env>-<deployment_id>.yaml configs.

# Copy this file for each deployment you need and remove all comments. Be sure to generate a different deployment ID for each.
# Rename the file using the format <env>-<deployment_id>.yaml.
name: <string>
# (Optional) A short label that `task tf-switch` and `task ls-deploys` show
# next to the deployment name. Use it to tell apart deployments that have
# the same env (e.g. two deployments of different services in the same
# subscription). OpenTofu does not read it.
# description: <string>
# The tier. To use other tiers, see "Change the tiers" in README.md.
env: <develop|stage|prod>
# Generate the ID with `task gen-deploy-id` and keep the quotes. Without
# quotes, YAML reads an ID such as 12345678 or 1234e567 as a number, and
# OpenTofu changes it. tf.sh stops with an error for an unquoted
# number-like env or deployment_id.
deployment_id: "<id>"
service: <varies>
owner: <team-or-group-name>
managed_by: <repository URL>

azure:
  # The Azure region for the resources, as a lowercase short name, e.g.
  # eastus or westeurope. Run `az account list-locations -o table` and use
  # the Name column. OpenTofu passes it to terraform/ as var.location. The
  # azurerm provider has no provider-level region.
  location: <azure-region, e.g. eastus>
  # The subscription and the Entra ID tenant of this deployment. Keep the
  # quotes.
  subscription_id: "<subscription-guid>"
  tenant_id: "<tenant-guid>"

# The state backend (storage account, container) is not set here. It is in
# deployments/backends/<env>-<deployment_id>.azurerm.tfbackend.

# CI settings. OpenTofu does not read this block. The CI script
# (.ci/scripts/tf.sh) reads it on both GitLab CI and GitHub Actions.
ci:
  # The client ID of the managed identity (or app registration) that CI jobs
  # use for this deployment. CI signs in as it through OIDC (no stored
  # secrets). Its federated credentials must allow your CI platform. See
  # "CI Auth" in README.md.
  azure_client_id: "<client-guid>"

# Add project specific config below
config:
